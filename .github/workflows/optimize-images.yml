name: Optimize MEC Autos images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing library
        run: python -m pip install --disable-pip-version-check pillow
      - name: Resize and recompress non-hero images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import os
          import tempfile

          root = Path("public")
          profiles = {
            **{f"apostila{i}.webp": (900, 83) for i in range(1, 7)},
            **{f"videoaula{i}.webp": (1100, 83) for i in range(1, 7)},
            "bonus.webp": (1280, 83),
            "certificado1.webp": (1100, 84),
            "certificado2.webp": (1100, 84),
            "perfil.webp": (600, 83),
          }
          for filename, (max_width, quality) in profiles.items():
              path = root / filename
              if not path.exists():
                  raise SystemExit(f"Missing expected image: {path}")
              before = path.stat().st_size
              with Image.open(path) as source:
                  image = ImageOps.exif_transpose(source)
                  if image.width > max_width:
                      height = round(image.height * max_width / image.width)
                      image = image.resize((max_width, height), Image.Resampling.LANCZOS)
                  if image.mode not in ("RGB", "RGBA"):
                      image = image.convert("RGBA" if "A" in image.getbands() else "RGB")
                  fd, tmp = tempfile.mkstemp(suffix=".webp", dir=root)
                  os.close(fd)
                  try:
                      image.save(tmp, format="WEBP", quality=quality, method=6)
                      after = os.path.getsize(tmp)
                      if after < before:
                          os.replace(tmp, path)
                      else:
                          os.remove(tmp)
                  finally:
                      if os.path.exists(tmp):
                          os.remove(tmp)
              print(f"{filename}: {before:,} -> {path.stat().st_size:,} bytes")
          PY
      - name: Commit optimized media
        run: |
          git add public/*.webp
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "perf: compress carousel and secondary images without visual redesign"
            git push
          fi
